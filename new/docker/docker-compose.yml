name: ai-ds

services:
  backend:
    build:
      context: ../backend
      dockerfile: docker/Dockerfile
    image: ai-ds-backend:latest
    container_name: ai-ds-backend
    restart: unless-stopped
    environment:
      API_PORT: "8010"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANALYST_MODEL: ${ANALYST_MODEL:-qwen3.8:27b}
      CODER_MODEL: ${CODER_MODEL:-qwen3-coder:latest}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-jobs:/app/data/jobs
    ports:
      - "${API_HOST_PORT:-8020}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    image: ai-ds-frontend:latest
    container_name: ai-ds-frontend
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-jobs:
