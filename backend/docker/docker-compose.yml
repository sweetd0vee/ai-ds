name: ai-ds-backend

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-ds-backend:latest
    container_name: ai-ds-backend
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-8020}:8010"
    environment:
      API_PORT: "8010"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANALYST_MODEL: ${ANALYST_MODEL:-qwen3.8:27b}
      CODER_MODEL: ${CODER_MODEL:-qwen3-coder:latest}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend-jobs:/app/data/jobs

volumes:
  backend-jobs:
